<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Alunos | Ralf</title>
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- CSS Externo -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand">
                📚 Gerenciamento de Alunos
            </span>
        </div>
    </nav>

    <main class="container pb-5">
        <!-- Mensagens -->
        <div id="mensagem" class="alert" role="alert"></div>

        <!-- Botão Adicionar -->
        <div class="mb-4">
            <button 
                type="button" 
                class="btn btn-primary" 
                data-bs-toggle="modal" 
                data-bs-target="#modalAluno"
                onclick="abrirModalCadastro()"
            >
                ➕ Cadastrar Novo Aluno
            </button>
        </div>

        <!-- Lista -->
        <div class="card">
            <div class="card-header">
                <span>Alunos cadastrados</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Nota 1</th>
                                <th>Nota 2</th>
                                <th>Média</th>
                                <th>Situação</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaAlunos"></tbody>
                    </table>
                </div>

                <!-- Loading -->
                <div id="loading" class="loading text-center p-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <div class="mt-2">Carregando alunos...</div>
                </div>

                <!-- Estado vazio -->
                <div id="estadoVazio" class="empty-state text-center py-5">
                    <div class="fs-1">📚</div>
                    <h5>Nenhum aluno cadastrado</h5>
                    <p class="mb-0">Clique no botão acima para cadastrar o primeiro aluno.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL: CADASTRAR/EDITAR ALUNO -->
    <div class="modal fade" id="modalAluno" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Cadastrar Aluno</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formAluno">
                    <div class="modal-body">
                        <!-- Código -->
                        <input type="hidden" id="codigo">
                        
                        <!-- Nome -->
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input
                                type="text"
                                class="form-control"
                                id="nome"
                                placeholder="Digite o nome do aluno"
                                required
                            >
                        </div>
                        
                        <!-- Nota 1 -->
                        <div class="mb-3">
                            <label for="nota1" class="form-label">Nota 1</label>
                            <input
                                type="number"
                                class="form-control"
                                id="nota1"
                                min="0"
                                max="10"
                                step="0.01"
                                placeholder="0 a 10"
                                required
                            >
                        </div>
                        
                        <!-- Nota 2 -->
                        <div class="mb-3">
                            <label for="nota2" class="form-label">Nota 2</label>
                            <input
                                type="number"
                                class="form-control"
                                id="nota2"
                                min="0"
                                max="10"
                                step="0.01"
                                placeholder="0 a 10"
                                required
                            >
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnSalvar">
                            Cadastrar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL: CONFIRMAÇÃO DE EXCLUSÃO -->
    <div class="modal fade" id="modalExcluir" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar exclusão</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja excluir o aluno <strong id="nomeExcluir"></strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmarExclusao">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================================
        // CONFIGURAÇÃO
        // ============================================================
        const API_URL = "https://api-alunos-fspv.onrender.com/";

        // ============================================================
        // ELEMENTOS
        // ============================================================
        const formAluno = document.getElementById("formAluno");
        const codigoInput = document.getElementById("codigo");
        const nomeInput = document.getElementById("nome");
        const nota1Input = document.getElementById("nota1");
        const nota2Input = document.getElementById("nota2");
        const tabelaAlunos = document.getElementById("tabelaAlunos");
        const loading = document.getElementById("loading");
        const estadoVazio = document.getElementById("estadoVazio");
        const tituloModal = document.getElementById("tituloModal");
        const btnSalvar = document.getElementById("btnSalvar");
        const mensagem = document.getElementById("mensagem");

        // Modais
        const modalAlunoElement = document.getElementById("modalAluno");
        const modalAluno = new bootstrap.Modal(modalAlunoElement);
        const modalExcluirElement = document.getElementById("modalExcluir");
        const modalExcluir = new bootstrap.Modal(modalExcluirElement);
        const nomeExcluir = document.getElementById("nomeExcluir");
        const btnConfirmarExclusao = document.getElementById("btnConfirmarExclusao");
        let codigoAlunoExcluir = null;

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        document.addEventListener("DOMContentLoaded", () => {
            listarAlunos();
        });

        // Fecha o modal e limpa o formulário quando o usuário clica em cancelar ou fora do modal
        modalAlunoElement.addEventListener('hidden.bs.modal', () => {
            limparFormulario();
        });

        // ============================================================
        // ABRIR MODAL PARA CADASTRO
        // ============================================================
        function abrirModalCadastro() {
            limparFormulario();
            tituloModal.textContent = "Cadastrar Aluno";
            btnSalvar.textContent = "Cadastrar";
        }

        // ============================================================
        // GET /alunos
        // ============================================================
        async function listarAlunos() {
            try {
                loading.style.display = "block";
                estadoVazio.style.display = "none";
                tabelaAlunos.innerHTML = "";
                
                const resposta = await fetch(`${API_URL}/alunos`, { method: "GET" });
                if (!resposta.ok) throw new Error("Não foi possível carregar os alunos.");
                
                const alunos = await resposta.json();
                loading.style.display = "none";
                
                if (!alunos || alunos.length === 0) {
                    estadoVazio.style.display = "block";
                    return;
                }

                alunos.forEach(aluno => {
                    const linha = document.createElement("tr");
                    linha.innerHTML = `
                        <td>
                            <strong>${escapeHTML(aluno.nome)}</strong>
                            <div class="codigo small text-muted">${escapeHTML(aluno.codigo)}</div>
                        </td>
                        <td><span class="nota">${formatarNota(aluno.nota1)}</span></td>
                        <td><span class="nota">${formatarNota(aluno.nota2)}</span></td>
                        <td><span class="nota">${formatarNota(aluno.media)}</span></td>
                        <td>${criarBadgeSituacao(aluno.situacao)}</td>
                        <td class="text-center">
                            <div class="btn-group">
                                <button
                                    class="btn btn-sm btn-outline-primary"
                                    title="Editar"
                                    onclick='editarAluno(${JSON.stringify(aluno)})'
                                >✏️</button>
                                <button
                                    class="btn btn-sm btn-outline-danger"
                                    title="Excluir"
                                    onclick="abrirModalExclusao(
                                        '${aluno.codigo}',
                                        '${escapeAttribute(aluno.nome)}'
                                    )"
                                >🗑️</button>
                            </div>
                        </td>
                    `;
                    tabelaAlunos.appendChild(linha);
                });
            } catch (erro) {
                loading.style.display = "none";
                mostrarMensagem(erro.message, "danger");
            }
        }

        // ============================================================
        // POST /alunos
        // ============================================================
        async function cadastrarAluno() {
            const aluno = {
                nome: nomeInput.value.trim(),
                nota1: Number(nota1Input.value),
                nota2: Number(nota2Input.value)
            };

            if (!validarFormulario(aluno)) return;

            try {
                btnSalvar.disabled = true;
                btnSalvar.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Cadastrando...`;
                
                const resposta = await fetch(`${API_URL}/alunos`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(aluno)
                });

                if (!resposta.ok) {
                    const erro = await resposta.text();
                    throw new Error(erro || "Erro ao cadastrar aluno.");
                }

                const alunoCadastrado = await resposta.json();
                mostrarMensagem(`Aluno "${alunoCadastrado.nome}" cadastrado com sucesso!`, "success");
                
                modalAluno.hide();
                await listarAlunos();
            } catch (erro) {
                mostrarMensagem(erro.message, "danger");
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.innerHTML = "Cadastrar";
            }
        }

        // ============================================================
        // PUT /alunos/{codigo}
        // ============================================================
        async function atualizarAluno() {
            const codigo = codigoInput.value;
            const aluno = {
                nome: nomeInput.value.trim(),
                nota1: Number(nota1Input.value),
                nota2: Number(nota2Input.value)
            };

            if (!validarFormulario(aluno)) return;

            try {
                btnSalvar.disabled = true;
                btnSalvar.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Salvando...`;
                
                const resposta = await fetch(
                    `${API_URL}/alunos/${encodeURIComponent(codigo)}`,
                    {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(aluno)
                    }
                );

                if (!resposta.ok) {
                    const erro = await resposta.text();
                    throw new Error(erro || "Erro ao alterar aluno.");
                }

                const alunoAtualizado = await resposta.json();
                mostrarMensagem(`Aluno "${alunoAtualizado.nome}" alterado com sucesso!`, "success");
                
                modalAluno.hide();
                await listarAlunos();
            } catch (erro) {
                mostrarMensagem(erro.message, "danger");
            } finally {
                btnSalvar.disabled = false;
                btnSalvar.innerHTML = "Salvar alterações";
            }
        }

        // ============================================================
        // DELETE /alunos/{codigo}
        // ============================================================
        async function excluirAluno() {
            if (!codigoAlunoExcluir) return;

            try {
                btnConfirmarExclusao.disabled = true;
                btnConfirmarExclusao.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Excluindo...`;
                
                const resposta = await fetch(
                    `${API_URL}/alunos/${encodeURIComponent(codigoAlunoExcluir)}`,
                    { method: "DELETE" }
                );

                if (!resposta.ok) {
                    const erro = await resposta.text();
                    throw new Error(erro || "Erro ao excluir aluno.");
                }

                modalExcluir.hide();
                mostrarMensagem("Aluno excluído com sucesso!", "success");
                await listarAlunos();
            } catch (erro) {
                mostrarMensagem(erro.message, "danger");
            } finally {
                btnConfirmarExclusao.disabled = false;
                btnConfirmarExclusao.innerHTML = "Excluir";
                codigoAlunoExcluir = null;
            }
        }

        // ============================================================
        // SUBMIT DO FORMULÁRIO
        // ============================================================
        formAluno.addEventListener("submit", async function(event) {
            event.preventDefault();
            
            if (codigoInput.value) {
                await atualizarAluno();
            } else {
                await cadastrarAluno();
            }
        });

        // ============================================================
        // EDITAR ALUNO — ABRE MODAL COM DADOS
        // ============================================================
        function editarAluno(aluno) {
            codigoInput.value = aluno.codigo;
            nomeInput.value = aluno.nome;
            nota1Input.value = aluno.nota1;
            nota2Input.value = aluno.nota2;
            
            tituloModal.textContent = "Alterar Aluno";
            btnSalvar.textContent = "Salvar alterações";
            
            modalAluno.show();
            nomeInput.focus();
        }

        // ============================================================
        // LIMPAR FORMULÁRIO
        // ============================================================
        function limparFormulario() {
            formAluno.reset();
            codigoInput.value = "";
            tituloModal.textContent = "Cadastrar Aluno";
            btnSalvar.textContent = "Cadastrar";
        }

        // ============================================================
        // MODAL DE EXCLUSÃO
        // ============================================================
        function abrirModalExclusao(codigo, nome) {
            codigoAlunoExcluir = codigo;
            nomeExcluir.textContent = nome;
            modalExcluir.show();
        }

        btnConfirmarExclusao.addEventListener("click", excluirAluno);

        // ============================================================
        // VALIDAÇÃO
        // ============================================================
        function validarFormulario(aluno) {
            if (!aluno.nome) {
                mostrarMensagem("Informe o nome do aluno.", "warning");
                nomeInput.focus();
                return false;
            }
            if (isNaN(aluno.nota1) || aluno.nota1 < 0 || aluno.nota1 > 10) {
                mostrarMensagem("A Nota 1 deve estar entre 0 e 10.", "warning");
                nota1Input.focus();
                return false;
            }
            if (isNaN(aluno.nota2) || aluno.nota2 < 0 || aluno.nota2 > 10) {
                mostrarMensagem("A Nota 2 deve estar entre 0 e 10.", "warning");
                nota2Input.focus();
                return false;
            }
            return true;
        }

        // ============================================================
        // UTILITÁRIOS
        // ============================================================
        function criarBadgeSituacao(situacao) {
            let classe = "bg-secondary";
            if (situacao === "Aprovado(a)") classe = "bg-success";
            else if (situacao === "Em Recuperação") classe = "bg-warning text-dark";
            else if (situacao === "Reprovado(a)") classe = "bg-danger";
            return `<span class="badge ${classe}">${escapeHTML(situacao)}</span>`;
        }

        function formatarNota(nota) {
            return Number(nota).toFixed(2);
        }

        function mostrarMensagem(texto, tipo) {
            mensagem.className = `alert alert-${tipo}`;
            mensagem.textContent = texto;
            mensagem.style.display = "block";
            setTimeout(() => {
                mensagem.style.display = "none";
            }, 4000);
        }

        function escapeHTML(valor) {
            return String(valor)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function escapeAttribute(valor) {
            return String(valor)
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'")
                .replaceAll('"', "&quot;")
                .replaceAll("\n", "\\n")
                .replaceAll("\r", "\\r");
        }
    </script>
</body>
</html>
